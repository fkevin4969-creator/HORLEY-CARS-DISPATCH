<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORLEY CARS — Cancelled</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font:13px Arial;background:#eef0f2;color:#20252a}.top{height:46px;background:#34383d;color:#fff;display:flex;align-items:center;padding:0 12px;gap:12px}.logo{font-size:19px;font-weight:900}.back{background:#1473e6;color:white;border:0;padding:9px 14px;font-weight:800;cursor:pointer}.wrap{padding:8px}.head{background:#51565b;color:#fff;padding:9px;font-weight:900}.count{color:#dc2626}table{width:100%;border-collapse:collapse;background:white}th{background:#454a4f;color:#fff;padding:8px;text-align:left;position:sticky;top:0}td{padding:8px;border-bottom:1px solid #ddd}.status{color:#dc2626;font-weight:900}.drv{background:#16a34a;color:white;font-weight:900;padding:4px 7px;border-radius:3px;display:inline-block;min-width:28px;text-align:center}</style></head><body><div class="top"><div class="logo">HORLEY CARS</div><button class="back" onclick="location.href='./?v=202609301430'">← DISPATCH</button><b>CANCELLED BOOKINGS <span id="count" class="count"></span></b></div><div class="wrap"><div class="head">CANCELLED — MIGRATED & LIVE BOOKINGS</div><table><thead><tr><th>Time</th><th>Ref</th><th>Status</th><th>Drv</th><th>Pickup</th><th>Destination</th><th>P</th><th>Fare</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading cancelled bookings…</td></tr></tbody></table></div><script>const db=supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp');const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let {data,error}=await db.from('bookings').select('*').order('pickup_time',{ascending:false}).limit(2000);if(error){rows.innerHTML='<tr><td colspan="8">Could not load bookings: '+e(error.message)+'</td></tr>';return}data=(data||[]).filter(b=>String(b.booking_status||'').toLowerCase().includes('cancel'));count.textContent=data.length;rows.innerHTML=data.length?data.map(b=>{let d=b.pickup_time?new Date(b.pickup_time):null,t=d&&!isNaN(d)?d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—',ref=b.external_booking_id||String(b.id||'').slice(0,8).toUpperCase(),drv=b.external_driver_number||'—',fare=b.fare_estimate!=null?'£'+Number(b.fare_estimate).toFixed(2):'—';return `<tr><td>${e(t)}</td><td>${e(ref)}</td><td class="status">CANCELLED</td><td><span class="drv">${e(drv)}</span></td><td>${e(b.pickup_address||'')}</td><td>${e(b.destination_address||'')}</td><td>${e(b.passenger_count||1)}</td><td>${e(fare)}</td></tr>`}).join(''):'<tr><td colspan="8">No cancelled bookings found.</td></tr>'}load();</script></body></html>
