<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horley Cars — Customer Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#17202a}.wrap{max-width:900px;margin:30px auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 16px 50px #0005}.hero{background:#111827;color:#d4af37;padding:28px;text-align:center}.hero h1{margin:0;font-size:32px}.hero p{color:#fff;margin:8px 0 0}.main{padding:22px}.card{border:1px solid #d8dee6;border-radius:14px;padding:18px;margin-bottom:16px}.card h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}.btn{border:0;border-radius:10px;padding:13px 17px;font-weight:900;cursor:pointer;background:#d4af37;color:#111827}.btn.dark{background:#111827;color:#fff}.btn.red{background:#b91c1c;color:#fff}.actions{display:flex;gap:9px;flex-wrap:wrap}.msg{margin-top:10px;font-weight:700}.hidden{display:none}.booking{border-top:1px solid #e5e7eb;padding:12px 0}.booking:first-child{border-top:0}.status{font-weight:900;text-transform:uppercase}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:center}.booknow{display:inline-block;text-decoration:none;background:#d4af37;color:#111827;font-weight:900;padding:14px 18px;border-radius:10px}.small{font-size:12px;color:#64748b}@media(max-width:650px){.wrap{margin:0;min-height:100vh;border-radius:0}.grid{grid-template-columns:1fr}.toprow{display:block}.booknow{margin-top:10px}}</style></head><body><main class="wrap"><header class="hero"><h1>HORLEY CARS</h1><p>Customer Booking Account</p></header><div class="main"><section id="authCard" class="card"><h2>Sign in or create an account</h2><div class="grid"><div><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn dark" id="signin">SIGN IN</button><button class="btn" id="signup">CREATE ACCOUNT</button></div></div><div><b>Why create an account?</b><p>Keep your contact details with Horley Cars and see bookings linked to your account.</p><p class="small">You can still use the normal booking page without an account.</p></div></div><div id="authMsg" class="msg"></div></section><section id="account" class="hidden"><div class="card"><div class="toprow"><div><h2 style="margin-bottom:5px">My account</h2><div id="signedEmail" class="small"></div></div><a class="booknow" href="./index.html">BOOK A TAXI</a></div><div class="grid"><div class="field"><label>FULL NAME</label><input id="fullName"></div><div class="field"><label>PHONE NUMBER</label><input id="phone" type="tel"></div></div><div class="actions"><button class="btn" id="saveProfile">SAVE DETAILS</button><button class="btn red" id="signout">SIGN OUT</button></div><div id="profileMsg" class="msg"></div></div><div class="card"><h2>My bookings</h2><div id="history">Loading…</div></div></section></div></main><script>const db=supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp'),$=x=>document.getElementById(x);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function show(){let {data:{user}}=await db.auth.getUser();$('authCard').classList.toggle('hidden',!!user);$('account').classList.toggle('hidden',!user);if(!user)return;$('signedEmail').textContent=user.email||'';let {data:p}=await db.from('customers').select('*').eq('auth_user_id',user.id).maybeSingle();if(p){$('fullName').value=p.full_name||'';$('phone').value=p.phone||''}await history()}async function history(){let {data,error}=await db.from('bookings').select('id,pickup_address,destination_address,pickup_time,booking_status,fare_estimate,fare').order('pickup_time',{ascending:false}).limit(30);if(error){$('history').textContent='No linked bookings yet.';return}$('history').innerHTML=data?.length?data.map(b=>`<div class="booking"><b>${esc(b.pickup_address)} → ${esc(b.destination_address)}</b><br><span class="status">${esc((b.booking_status||'').replaceAll('_',' '))}</span> · ${b.pickup_time?new Date(b.pickup_time).toLocaleString('en-GB'):''}${b.fare||b.fare_estimate?' · £'+Number(b.fare||b.fare_estimate).toFixed(2):''}<br><span class="small">Ref ${esc(b.id.slice(0,8).toUpperCase())}</span></div>`).join(''):'No linked bookings yet.'}async function ensureProfile(user){let {data:p}=await db.from('customers').select('id').eq('auth_user_id',user.id).maybeSingle();if(!p){await db.from('customers').insert({auth_user_id:user.id,full_name:'',phone:'',email:user.email})}}$('signin').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authMsg').textContent=error?error.message:'Signed in.';if(!error)show()};$('signup').onclick=async()=>{let {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authMsg').textContent=error?error.message:(data.user?'Account created. Check your email if confirmation is required.':'Account created.');if(data.user){await ensureProfile(data.user);show()}};$('saveProfile').onclick=async()=>{let {data:{user}}=await db.auth.getUser();if(!user)return;let {error}=await db.from('customers').upsert({auth_user_id:user.id,full_name:$('fullName').value.trim(),phone:$('phone').value.trim(),email:user.email},{onConflict:'auth_user_id'});$('profileMsg').textContent=error?error.message:'Details saved.'};$('signout').onclick=async()=>{await db.auth.signOut();show()};db.auth.onAuthStateChange(()=>setTimeout(show,0));show();</script></body></html>
