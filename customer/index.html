<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Horley Cars — Book a Taxi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17202a}.wrap{max-width:560px;margin:auto;min-height:100vh;background:#fff}.hero{background:#111827;color:#fff;padding:25px 20px;text-align:center}.hero h1{margin:0;font-size:29px;letter-spacing:.5px}.hero p{margin:7px 0 0;color:#dbe4ef}.form{padding:18px}.card{background:#fff;border:1px solid #d8dee6;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 3px 12px #0000000d}.card h2{font-size:16px;margin:0 0 13px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#475569}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}.field textarea{min-height:75px;resize:vertical}.route{display:grid;gap:10px}.dot{display:flex;gap:10px;align-items:center}.pin{width:12px;height:12px;border-radius:50%;background:#1473e6;flex:none}.pin.dest{background:#16a34a}.vehicles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.v{border:2px solid #d8dee6;border-radius:11px;padding:11px 5px;text-align:center;cursor:pointer;background:#fff;font-weight:700}.v.active{border-color:#1473e6;background:#eaf3ff;color:#075fc2}.v small{display:block;font-weight:400;margin-top:3px;color:#64748b}.fare{background:#f1f5f9;border-radius:12px;padding:13px;display:flex;justify-content:space-between;align-items:center}.fare strong{font-size:24px}.book{width:100%;border:0;border-radius:12px;background:#1473e6;color:#fff;padding:16px;font-size:17px;font-weight:900;cursor:pointer}.book:disabled{background:#94a3b8}.status{margin-top:10px;text-align:center;font-weight:700;min-height:18px}.success{background:#dcfce7;color:#166534;border-radius:12px;padding:14px}.foot{text-align:center;color:#64748b;font-size:12px;padding:4px 18px 24px}@media(max-width:420px){.hero{padding:21px 15px}.form{padding:12px}.card{padding:13px}.vehicles{gap:5px}}</style></head><body><main class="wrap"><header class="hero"><h1>HORLEY CARS</h1><p>Local taxis & airport transfers</p></header><div class="form"><section class="card"><h2>Where are you going?</h2><div class="route"><div class="dot"><span class="pin"></span><div class="field" style="margin:0;flex:1"><label>PICKUP</label><input id="pickup" placeholder="Pickup address or postcode" autocomplete="street-address"></div></div><div class="dot"><span class="pin dest"></span><div class="field" style="margin:0;flex:1"><label>DESTINATION</label><input id="dest" placeholder="Destination address or postcode"></div></div></div><div class="field"><label>PICKUP DATE & TIME</label><input id="time" type="datetime-local"></div></section><section class="card"><h2>Your details</h2><div class="field"><label>NAME</label><input id="name" placeholder="Your name" autocomplete="name"></div><div class="field"><label>PHONE NUMBER</label><input id="phone" type="tel" placeholder="Your mobile number" autocomplete="tel"></div><div class="field"><label>PASSENGERS</label><input id="ppl" type="number" min="1" max="8" value="1"></div><div class="field"><label>FLIGHT NUMBER — OPTIONAL</label><input id="flight" placeholder="e.g. BA2816"></div></section><section class="card"><h2>Choose your vehicle</h2><div class="vehicles"><button class="v active" data-m="1" data-name="Standard / 4 Seater">4 Seater<small>Standard</small></button><button class="v" data-m="1.5" data-name="6 Seater">6 Seater<small>Fare × 1.5</small></button><button class="v" data-m="2" data-name="8 Seater">8 Seater<small>Fare × 2</small></button></div><div class="fare" style="margin-top:13px"><span>Estimated fare</span><strong id="fare">—</strong></div><div id="fareNote" style="font-size:11px;color:#64748b;margin-top:6px">Fare will show where a fixed Horley Cars fare is available.</div></section><section class="card"><div class="field" style="margin-top:0"><label>NOTES — OPTIONAL</label><textarea id="notes" placeholder="Anything the driver should know?"></textarea></div><button id="book" class="book">BOOK TAXI</button><div id="status" class="status"></div></section></div><div class="foot">HORLEY CARS • Taxi & Private Hire</div></main><script>const db=supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp'),$=id=>document.getElementById(id);let mult=1,vehicle='Standard / 4 Seater';function normal(v){return v.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function baseFare(){let p=normal($('pickup').value),d=normal($('dest').value);if(!p||!d)return null;let heath=x=>x.includes('heathrow'),gat=x=>x.includes('gatwick'),west=x=>x.includes('west vale drive'),rh1=x=>/\brh1\b/.test(x);if(heath(p))return 90;if(heath(d))return 75;if(west(p)&&gat(d))return 13;if(rh1(p)&&gat(d))return 20;if(rh1(p)&&heath(d))return 75;return null}function calc(){let b=baseFare();$('fare').textContent=b==null?'—':'£'+(b*mult).toFixed(2);$('fareNote').textContent=b==null?'Fare will be confirmed by Horley Cars.':'Estimated fixed fare for this journey.'}document.querySelectorAll('.v').forEach(b=>b.onclick=()=>{document.querySelectorAll('.v').forEach(x=>x.classList.remove('active'));b.classList.add('active');mult=+b.dataset.m;vehicle=b.dataset.name;calc()});['pickup','dest'].forEach(id=>$(id).addEventListener('input',calc));function localDefault(){let d=new Date(Date.now()+10*60000),z=n=>String(n).padStart(2,'0');$('time').value=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}localDefault();$('book').onclick=async()=>{let pickup=$('pickup').value.trim(),dest=$('dest').value.trim(),name=$('name').value.trim(),phone=$('phone').value.trim();if(!pickup||!dest||!name||!phone){$('status').textContent='Please enter pickup, destination, name and phone number.';return}let b=baseFare(),fare=b==null?null:b*mult,notes=['Customer app booking','Vehicle: '+vehicle,$('notes').value.trim()].filter(Boolean).join(' | ');$('book').disabled=true;$('status').textContent='Sending booking…';let r=await db.rpc('create_booking',{p_pickup_address:pickup,p_destination_address:dest,p_passenger_count:+$('ppl').value||1,p_notes:notes,p_customer_name:name,p_customer_phone:phone,p_flight_number:$('flight').value.trim().toUpperCase()||null,p_fare:fare,p_pickup_time:$('time').value?new Date($('time').value).toISOString():new Date().toISOString(),p_luggage_count:0,p_pickup_latitude:null,p_pickup_longitude:null,p_destination_latitude:null,p_destination_longitude:null});$('book').disabled=false;if(r.error){$('status').className='status';$('status').textContent='Sorry, we could not send the booking. Please try again.';return}let row=Array.isArray(r.data)?r.data[0]:r.data,ref=row?.id?row.id.slice(0,8).toUpperCase():'';$('status').className='status success';$('status').innerHTML='✓ Booking received by HORLEY CARS'+(ref?'<br>Reference: '+ref:'');};</script></body></html>
