<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Horley Cars — Book a Taxi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17202a}.wrap{max-width:1040px;margin:28px auto;min-height:calc(100vh - 56px);background:#fff;border-radius:20px;overflow:visible;box-shadow:0 12px 40px #00000018}.hero{background:#111827;color:#fff;padding:30px 24px;text-align:center;border-radius:20px 20px 0 0}.hero h1{margin:0;font-size:34px}.hero p{margin:7px 0 0;color:#dbe4ef}.accountbar{background:#d4af37;color:#111827;padding:10px 18px;text-align:center;font-weight:800}.accountbar a{color:#111827}.form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.card{background:#fff;border:1px solid #d8dee6;border-radius:16px;padding:19px;box-shadow:0 3px 12px #0000000d}.card h2{font-size:18px;margin:0 0 15px}.field{margin:12px 0;position:relative}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#475569}.field input,.field textarea{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff;outline:none}.field textarea{min-height:88px;resize:vertical}.route{display:grid;gap:12px}.dot{display:flex;gap:10px;align-items:center}.pin{width:13px;height:13px;border-radius:50%;background:#1473e6;flex:none}.pin.dest{background:#16a34a}.suggestions{position:absolute;left:0;right:0;top:100%;z-index:50;background:#fff;border:1px solid #b8c3cf;border-radius:10px;box-shadow:0 8px 22px #0002;max-height:230px;overflow:auto;display:none;margin-top:3px}.suggestion{padding:11px 12px;border-bottom:1px solid #edf0f3;cursor:pointer;font-size:13px}.vehicles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.v{border:2px solid #d8dee6;border-radius:13px;padding:16px 6px;text-align:center;cursor:pointer;background:#fff;font-size:15px;font-weight:800}.v.active{border-color:#1473e6;background:#eaf3ff;color:#075fc2}.v small{display:block;font-weight:400;margin-top:5px;color:#64748b}.fare{background:#eef6ff;border:1px solid #cfe3fa;border-radius:14px;padding:17px;display:flex;justify-content:space-between;align-items:center}.fare strong{font-size:30px;color:#075fc2}.book{width:100%;border:0;border-radius:13px;background:#1473e6;color:#fff;padding:18px;font-size:19px;font-weight:900;cursor:pointer}.book:disabled{background:#94a3b8}.status{margin-top:12px;text-align:center;font-weight:700;min-height:18px}.success{background:#dcfce7;color:#166534;border-radius:12px;padding:14px}.foot{text-align:center;color:#64748b;font-size:12px;padding:3px 18px 24px}.fareNote{font-size:12px;color:#64748b;margin-top:8px}@media(max-width:700px){body{background:#fff}.wrap{margin:0;min-height:100vh;border-radius:0}.hero{border-radius:0}.form{display:block;padding:12px}.card{margin-bottom:12px}}</style></head><body><main class="wrap"><header class="hero"><h1>HORLEY CARS</h1><p>Local taxis & airport transfers</p></header><div id="accountbar" class="accountbar">Checking customer account…</div><div class="form"><section class="card"><h2>Where are you going?</h2><div class="route"><div class="dot"><span class="pin"></span><div class="field" style="margin:0;flex:1"><label>PICKUP</label><input id="pickup" placeholder="Start typing address or postcode" autocomplete="off"><div id="pickupSuggestions" class="suggestions"></div></div></div><div class="dot"><span class="pin dest"></span><div class="field" style="margin:0;flex:1"><label>DESTINATION</label><input id="dest" placeholder="Start typing address or postcode" autocomplete="off"><div id="destSuggestions" class="suggestions"></div></div></div></div><div class="field"><label>PICKUP DATE & TIME</label><input id="time" type="datetime-local"></div></section><section class="card"><h2>Your details</h2><div class="field"><label>NAME</label><input id="name"></div><div class="field"><label>PHONE NUMBER</label><input id="phone" type="tel"></div><div class="field"><label>PASSENGERS</label><input id="ppl" type="number" min="1" max="8" value="1"></div><div class="field"><label>FLIGHT NUMBER — OPTIONAL</label><input id="flight"></div></section><section class="card"><h2>Choose your vehicle</h2><div class="vehicles"><button class="v active" data-m="1" data-name="Standard / 4 Seater">4 Seater<small>Standard</small></button><button class="v" data-m="1.5" data-name="6 Seater">6 Seater<small>Fare × 1.5</small></button><button class="v" data-m="2" data-name="8 Seater">8 Seater<small>Fare × 2</small></button></div><div class="fare" style="margin-top:15px"><span>Estimated fare</span><strong id="fare">—</strong></div><div id="fareNote" class="fareNote">Fare will show where a fixed Horley Cars fare is available.</div></section><section class="card"><div class="field" style="margin-top:0"><label>NOTES — OPTIONAL</label><textarea id="notes"></textarea></div><button id="book" class="book">BOOK TAXI</button><div id="status" class="status"></div></section></div><div class="foot">HORLEY CARS • Taxi & Private Hire</div></main><script>const db=supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp'),$=id=>document.getElementById(id);let mult=1,vehicle='Standard / 4 Seater',coords={pickup:null,dest:null},timers={},currentUser=null;function normal(v){return v.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function baseFare(){let p=normal($('pickup').value),d=normal($('dest').value);if(!p||!d)return null;let heath=x=>x.includes('heathrow'),gat=x=>x.includes('gatwick'),west=x=>x.includes('west vale drive'),rh1=x=>/\brh1\b/.test(x);if(heath(p))return 90;if(heath(d))return 75;if(west(p)&&gat(d))return 13;if(rh1(p)&&gat(d))return 20;if(rh1(p)&&heath(d))return 75;return null}function calc(){let b=baseFare();$('fare').textContent=b==null?'—':'£'+(b*mult).toFixed(2);$('fareNote').textContent=b==null?'Fare will be confirmed by Horley Cars.':'Estimated fixed fare for this journey.'}document.querySelectorAll('.v').forEach(b=>b.onclick=()=>{document.querySelectorAll('.v').forEach(x=>x.classList.remove('active'));b.classList.add('active');mult=+b.dataset.m;vehicle=b.dataset.name;calc()});function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function searchAddress(which){let q=$(which).value.trim(),box=$(which+'Suggestions');coords[which]=null;calc();if(q.length<3){box.style.display='none';return}try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&addressdetails=1&limit=6&q='+encodeURIComponent(q)),j=await r.json();window['_addr_'+which]=j;box.innerHTML=j.map((x,i)=>`<div class="suggestion" onclick="pickAddress('${which}',${i})">${esc(x.display_name)}</div>`).join('');box.style.display='block'}catch{box.style.display='none'}}window.pickAddress=(which,i)=>{let x=window['_addr_'+which]?.[i];if(!x)return;$(which).value=x.display_name;coords[which]=[+x.lat,+x.lon];$(which+'Suggestions').style.display='none';calc()};['pickup','dest'].forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(timers[id]);timers[id]=setTimeout(()=>searchAddress(id),450)}));async function loadAccount(){let {data:{user}}=await db.auth.getUser();currentUser=user;if(!user){$('accountbar').innerHTML='Want to save your details and see your bookings? <a href="account.html">SIGN IN / CREATE ACCOUNT</a>';return}let {data:p}=await db.from('customers').select('full_name,phone').eq('auth_user_id',user.id).maybeSingle();if(p){if(!$('name').value)$('name').value=p.full_name||'';if(!$('phone').value)$('phone').value=p.phone||''}$('accountbar').innerHTML='Signed in as '+esc(user.email||'customer')+' · <a href="account.html">MY BOOKINGS</a>'}function localDefault(){let d=new Date(Date.now()+10*60000),z=n=>String(n).padStart(2,'0');$('time').value=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}localDefault();loadAccount();db.auth.onAuthStateChange(()=>setTimeout(loadAccount,0));$('book').onclick=async()=>{let pickup=$('pickup').value.trim(),dest=$('dest').value.trim(),name=$('name').value.trim(),phone=$('phone').value.trim();if(!pickup||!dest||!name||!phone){$('status').textContent='Please enter pickup, destination, name and phone number.';return}let b=baseFare(),fare=b==null?null:b*mult,notes=['Customer app booking','Vehicle: '+vehicle,$('notes').value.trim()].filter(Boolean).join(' | ');$('book').disabled=true;$('status').textContent='Sending booking…';let r=await db.rpc('create_booking',{p_pickup_address:pickup,p_destination_address:dest,p_passenger_count:+$('ppl').value||1,p_notes:notes,p_customer_name:name,p_customer_phone:phone,p_flight_number:$('flight').value.trim().toUpperCase()||null,p_fare:fare,p_pickup_time:$('time').value?new Date($('time').value).toISOString():new Date().toISOString(),p_luggage_count:0,p_pickup_latitude:coords.pickup?.[0]??null,p_pickup_longitude:coords.pickup?.[1]??null,p_destination_latitude:coords.dest?.[0]??null,p_destination_longitude:coords.dest?.[1]??null});if(!r.error&&currentUser){let row=Array.isArray(r.data)?r.data[0]:r.data;if(row?.id)await db.rpc('link_my_booking',{p_booking_id:row.id})}$('book').disabled=false;if(r.error){$('status').className='status';$('status').textContent='Sorry, we could not send the booking. Please try again.';return}let row=Array.isArray(r.data)?r.data[0]:r.data,ref=row?.id?row.id.slice(0,8).toUpperCase():'';$('status').className='status success';$('status').innerHTML='✓ Booking received by HORLEY CARS'+(ref?'<br>Reference: '+ref:'')+(currentUser?'<br><a href="account.html">View in My Bookings</a>':'');};</script></body></html>
