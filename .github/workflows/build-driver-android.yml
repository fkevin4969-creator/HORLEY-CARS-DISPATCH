# Rebuild trigger: driver navigation + clear job 2026-10-03
name: Build Horley Cars Driver Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'driver-app/**'
      - '.github/workflows/build-driver-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Configure Android API 36, minSdk 24 and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          if p.exists():
              s=p.read_text()
              s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
              s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
              s=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', s)
              p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          perms='''<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />'''
          if 'ACCESS_FINE_LOCATION' not in s:
              s=s.replace('<application',perms+'\n    <application',1)
          m.write_text(s)
          PY
      - name: Sync Horley Cars Driver
        run: npx cap sync android
      - name: Build Android test APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Build Play Store AAB
        run: cd android && ./gradlew bundleRelease
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: horley-cars-driver-test-apk
          path: driver-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: horley-cars-driver-play-store-aab
          path: driver-app/android/app/build/outputs/bundle/release/app-release.aab
      - name: Publish direct-download APK
        working-directory: .
        run: |
          mkdir -p downloads
          cp driver-app/android/app/build/outputs/apk/debug/app-debug.apk downloads/Horley-Cars-Driver.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/Horley-Cars-Driver.apk
          git commit -m "Update Horley Cars Driver APK" || exit 0
          git push
