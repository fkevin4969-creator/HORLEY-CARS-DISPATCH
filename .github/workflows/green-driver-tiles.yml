name: Apply road-test fixes
on:
  push:
    paths:
      - '.github/workflows/green-driver-tiles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply driver and dispatch fixes
        run: |
          git fetch origin driver-auth-update
          git show origin/driver-auth-update:driver-app/www/index.html > driver-app/www/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('legacy-dispatch.html')
          s=p.read_text()
          old="function tileColour(d,i){return '#16a34a'}"
          new="function tileColour(d,i){let j=activeJob(d.id),st=j?String(j.booking_status||'').toLowerCase():'';return statusColours[st]||'#16a34a'}"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Dispatch driver marker colour function not found')
          p.write_text(s)
          PY
      - name: Commit road-test fixes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add driver-app/www/index.html legacy-dispatch.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply driver auto-navigation and dispatch status colours"
          git push
