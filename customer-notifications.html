<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horley Cars Customer Notifications</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#eef2f6;color:#17202a}.top{background:#34383d;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}.top b{font-size:19px}.top a{margin-left:auto;color:#fff;background:#1473e6;padding:9px 12px;text-decoration:none;font-weight:800;border-radius:5px}.wrap{max-width:900px;margin:18px auto;padding:0 12px}.card{background:#fff;border:1px solid #c9ced3;border-radius:12px;padding:16px;margin-bottom:12px}.job{cursor:pointer}.job:hover,.job.sel{border:2px solid #1473e6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{font-size:11px;font-weight:900;color:#64748b}.value{font-weight:700;margin-top:3px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.buttons button,.send{border:0;border-radius:7px;padding:12px;font-weight:900;color:#fff;cursor:pointer}.assigned{background:#1473e6}.arrived{background:#d97706}.completed{background:#16803c}textarea{width:100%;min-height:115px;padding:10px;font:14px Arial}.send{background:#34383d;width:100%;margin-top:8px}.note{font-size:12px;color:#555;margin-top:8px}.empty{padding:30px;text-align:center;color:#667085}@media(max-width:650px){.grid,.buttons{grid-template-columns:1fr}}</style></head><body><div class="top"><b>HORLEY CARS — CUSTOMER NOTIFICATIONS</b><a href="./">BACK TO DISPATCH</a></div><div class="wrap"><div class="card"><b>SELECT A BOOKING</b><div id="jobs" class="empty">Loading bookings…</div></div><div id="notify" class="card" style="display:none"><div class="grid"><div><div class="label">CUSTOMER</div><div id="cust" class="value">—</div></div><div><div class="label">PHONE</div><div id="phone" class="value">—</div></div><div><div class="label">PICKUP</div><div id="pickup" class="value">—</div></div><div><div class="label">DRIVER</div><div id="driver" class="value">—</div></div></div><div class="buttons"><button class="assigned" onclick="prepare('assigned')">DRIVER ASSIGNED</button><button class="arrived" onclick="prepare('arrived')">DRIVER ARRIVED</button><button class="completed" onclick="prepare('completed')">JOB COMPLETED</button></div><textarea id="message" placeholder="Choose a notification above…"></textarea><button id="send" class="send">OPEN CUSTOMER TEXT MESSAGE</button><div id="status" class="note">This prepares the SMS using the customer's saved phone number. Your phone/device will ask you to send it; it does not send automatically yet.</div></div></div><script>const db=supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp');let jobs=[],drivers=[],selected=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dnum(id){let i=drivers.findIndex(d=>d.id===id);if(i<0)return'—';let d=drivers[i];return String(d.driver_number??d.number??d.callsign??d.call_sign??d.badge_number??i+1)}async function load(){let[a,h,d]=await Promise.all([db.rpc('dispatch_get_bookings'),db.rpc('dispatch_get_completed_jobs'),db.rpc('dispatch_get_drivers')]);jobs=[...(a.data||[]),...(h.data||[])];drivers=d.data||[];render()}function render(){if(!jobs.length){$('jobs').innerHTML='<div class="empty">No bookings found.</div>';return}$('jobs').className='';$('jobs').innerHTML=jobs.map(b=>`<div class="card job ${selected?.id===b.id?'sel':''}" onclick="choose('${b.id}')"><b>${esc((b.customer_name||'Customer'))}</b> — ${esc(b.customer_phone||'No phone')}<br><small>${esc(b.pickup_address)} → ${esc(b.destination_address)} • ${esc(String(b.booking_status||'').replaceAll('_',' ').toUpperCase())}</small></div>`).join('')}window.choose=id=>{selected=jobs.find(b=>b.id===id);if(!selected)return;$('notify').style.display='block';$('cust').textContent=selected.customer_name||'Customer';$('phone').textContent=selected.customer_phone||'No phone saved';$('pickup').textContent=selected.pickup_address||'—';$('driver').textContent=selected.driver_id?'Driver '+dnum(selected.driver_id):'Not assigned';$('message').value='';$('status').textContent=selected.customer_phone?'Choose a notification message above.':'This booking has no customer phone number saved.';render();$('notify').scrollIntoView({behavior:'smooth'})};window.prepare=type=>{if(!selected)return;let name=selected.customer_name?selected.customer_name.split(' ')[0]:'there',drv=selected.driver_id?dnum(selected.driver_id):'',pickup=selected.pickup_address||'your pickup';let text=type==='assigned'?`Hi ${name}, Horley Cars has assigned Driver ${drv||''} to your booking from ${pickup}. Thank you for choosing Horley Cars.`:type==='arrived'?`Hi ${name}, your Horley Cars driver${drv?' '+drv:''} has arrived at ${pickup}.`: `Hi ${name}, your Horley Cars journey is now complete. Thank you for travelling with Horley Cars.`;$('message').value=text};$('send').onclick=()=>{if(!selected?.customer_phone){$('status').textContent='No customer phone number saved for this booking.';return}let text=$('message').value.trim();if(!text){$('status').textContent='Choose or type a message first.';return}let phone=selected.customer_phone.replace(/[^+0-9]/g,'');window.location.href='sms:'+phone+'?body='+encodeURIComponent(text)};db.channel('customer-notify').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},load).subscribe();load();setInterval(load,5000)</script></body></html>
