<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORLEY CARS — Dispatch</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#34383d}#app{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="legacy-dispatch.html?v=20260930-1600"></iframe><script>const client=supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp');const frame=document.getElementById('app');frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;const tabs=d.querySelector('#bookingsSection .tabs'),tbody=d.getElementById('jobs');if(!tabs||!tbody)return;let btn=d.getElementById('cancelTab');if(!btn){btn=d.createElement('button');btn.id='cancelTab';btn.className='tab';btn.dataset.tab='cancelled';btn.style.color='#c00';btn.innerHTML='CANCELLED <span id="cancelCount">0</span>';tabs.appendChild(btn)}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>{if(!v)return'—';const x=new Date(v);return isNaN(x)?esc(v):x.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})};async function getCancelled(){const r=await client.from('bookings').select('*').eq('booking_status','cancelled').order('pickup_time',{ascending:false});return r}async function updateCount(){const r=await getCancelled();if(!r.error){const x=d.getElementById('cancelCount');if(x)x.textContent=(r.data||[]).length}}async function showCancelled(e){if(e){e.preventDefault();e.stopImmediatePropagation()}tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');tbody.innerHTML='<tr><td colspan="8">Loading cancelled bookings…</td></tr>';const r=await getCancelled();if(r.error){tbody.innerHTML='<tr><td colspan="8">Could not load cancelled bookings.</td></tr>';return}const rows=r.data||[];d.getElementById('cancelCount').textContent=rows.length;tbody.innerHTML=rows.length?rows.map(b=>{const ref=b.external_booking_id||String(b.id||'').slice(0,8).toUpperCase();const drv=b.external_driver_number||'—';const fare=b.fare_estimate==null?'—':'£'+Number(b.fare_estimate).toFixed(2);return `<tr><td>${dt(b.pickup_time)}</td><td>${esc(ref)}</td><td><b style="color:#c00">CANCELLED</b></td><td><span class="drvbadge" style="background:#16a34a">${esc(drv)}</span></td><td>${esc(b.pickup_address||'')}</td><td>${esc(b.destination_address||'')}</td><td>${esc(b.passenger_count||1)}</td><td>${esc(fare)}</td></tr>`}).join(''):'<tr><td colspan="8">No cancelled bookings found.</td></tr>'}btn.addEventListener('click',showCancelled,true);tabs.querySelectorAll('.tab:not(#cancelTab)').forEach(x=>x.addEventListener('click',()=>btn.classList.remove('active'),true));updateCount();setInterval(updateCount,30000)});</script></body></html>
