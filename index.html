<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORLEY CARS — Dispatch Console</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
*{box-sizing:border-box}body{margin:0;font:13px Arial,sans-serif;background:#bfc4c9;color:#20252a;overflow:hidden}.topbar{height:46px;background:#34383d;color:#fff;display:flex;align-items:center;gap:4px;padding:5px 8px}.logo{font-size:19px;font-weight:900;margin-right:10px}.nav{border:0;background:#555b61;color:#fff;padding:9px 13px;font-weight:800;cursor:pointer}.nav.active{background:#1473e6}.spacer{flex:1}.clock{font-size:15px;font-weight:800;margin-right:8px}.live{background:#16a34a;border-radius:12px;padding:5px 10px;font-weight:800}.workspace{height:calc(100vh - 46px);display:grid;grid-template-columns:390px minmax(550px,1fr) 285px;grid-template-rows:390px minmax(260px,1fr);gap:5px;padding:5px}.box{background:#f4f5f6;border:1px solid #8d9297;min-width:0}.boxhead{background:#51565b;color:#fff;padding:8px 10px;font-weight:900}.booking{grid-column:1;grid-row:1;padding:8px}.formrow{display:grid;grid-template-columns:62px 1fr;gap:7px;align-items:center;margin:7px 0}.formrow label{font-weight:900;color:#444}.formrow input,.formrow select{width:100%;height:32px;border:1px solid #aaa;padding:5px 7px;background:#fff;font-size:13px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:7px}.save{width:100%;height:38px;border:0;background:#4b5156;color:#fff;font-weight:900;margin-top:9px;cursor:pointer}.save:hover{background:#1473e6}#saveMessage{padding-top:6px;font-weight:700}.mapbox{grid-column:2;grid-row:1;position:relative}.map{position:absolute;inset:0}.maptools{position:absolute;z-index:500;left:10px;bottom:10px;background:#fff;padding:7px 10px;border:1px solid #888;font-weight:800}.driversbox{grid-column:3;grid-row:1/3;overflow:auto}.drivergrid{padding:7px;display:grid;gap:6px}.driver{background:#fff;border:1px solid #aaa;padding:7px;display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center}.driverno{font-size:21px;font-weight:900;text-align:center;background:#1473e6;color:#fff;padding:11px 2px}.driver.available .driverno,.driver.live .driverno{background:#159447}.driver.busy .driverno,.driver.assigned .driverno,.driver.accepted .driverno,.driver.arrived .driverno,.driver.passenger_on_board .driverno{background:#e0a100}.driver.offline .driverno{background:#777}.driver b{font-size:14px}.driver span{font-size:11px;color:#555;text-transform:uppercase;font-weight:700}.jobsbox{grid-column:1/3;grid-row:2;overflow:auto;background:#fff}.jobtabs{display:flex;background:#d7d7d7;border-bottom:1px solid #888;position:sticky;top:0;z-index:4}.jobtab{padding:9px 15px;border:0;border-right:1px solid #999;background:#d7d7d7;font-weight:900;cursor:pointer}.jobtab.active{background:#fff;color:#1473e6}.jobtable{width:100%;border-collapse:collapse;background:#fff;font-size:13px}.jobtable th{position:sticky;top:35px;background:#4f5459;color:#fff;padding:8px;text-align:left}.jobtable td{padding:8px;border-bottom:1px solid #ddd;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}.jobtable tbody tr:nth-child(even){background:#f5f7f8}.jobtable tbody tr:hover{background:#dcecff}.status{font-weight:900}.status-pending{color:#1769c2}.status-assigned,.status-accepted{color:#c38300}.status-arrived,.status-passenger_on_board{color:#b45309}.status-completed{color:#16803c}.routepanel{position:absolute;z-index:500;top:8px;left:8px;max-width:410px;background:#fff;padding:10px 12px;border:1px solid #888;box-shadow:0 2px 8px #0003}.routepanel b{display:block;margin-bottom:5px}.routeinfo{color:#1464c8;font-weight:900;margin-top:5px}@media(max-width:1000px){body{overflow:auto}.workspace{height:auto;display:block}.box{margin-bottom:6px}.mapbox{height:430px}.driversbox{max-height:400px}}
</style></head><body><div class="topbar"><div class="logo">HORLEY CARS</div><button class="nav active" data-view="dispatch">DISPATCH</button><button class="nav" data-view="bookings">BOOKINGS</button><button class="nav" data-view="drivers">DRIVERS</button><button class="nav" data-view="history">HISTORY</button><button class="nav" data-view="logs">LOGS</button><div class="spacer"></div><span id="clock" class="clock"></span><span id="live" class="live">CONNECTING</span></div><div class="workspace"><section class="box booking"><div class="boxhead">NEW BOOKING</div><div class="formrow"><label>DATE</label><input id="pickupTime" type="datetime-local"></div><div class="formrow"><label>ADDR</label><input id="pickup" placeholder="Pickup address / postcode"></div><div class="formrow"><label>DEST</label><input id="destination" placeholder="Destination address / postcode"></div><div class="formrow"><label>NAME</label><input id="customerName" placeholder="Customer name"></div><div class="formrow"><label>PHONE</label><input id="phone" placeholder="Phone number"></div><div class="twocol"><div class="formrow"><label>PPL</label><input id="passengers" type="number" min="1" value="1"></div><div class="formrow"><label>DRV</label><select id="bookingDriver"><option value="">Unassigned</option></select></div></div><div class="formrow"><label>FARE</label><input id="fare" type="number" min="0" step="0.01" placeholder="£0.00"></div><div class="formrow"><label>NOTES</label><input id="notes" placeholder="Booking notes"></div><button id="saveBooking" class="save">SAVE JOB</button><div id="saveMessage"></div></section><section class="box mapbox"><div id="roadMap" class="map"></div><div class="routepanel"><b>LIVE DISPATCH MAP</b><div id="routeText">Select a job below to view pickup and destination.</div><div id="routeInfo" class="routeinfo"></div></div><div class="maptools">Horley • Gatwick • Live Driver GPS</div></section><section class="box driversbox"><div class="boxhead">DRIVERS — NUMBER / STATUS</div><div id="drivers" class="drivergrid">Loading drivers…</div></section><section class="box jobsbox"><div class="jobtabs"><button class="jobtab active" data-tab="active">DISPATCH <span id="activeCount">0</span></button><button class="jobtab" data-tab="prebook">PRE-BOOKED <span id="prebookCount">0</span></button><button class="jobtab" data-tab="completed">COMPLETED <span id="completedCount">0</span></button></div><table class="jobtable"><thead><tr><th>Time</th><th>Ref</th><th>Status</th><th>Drv</th><th>Pickup</th><th>Destination</th><th>P</th><th>Fare</th></tr></thead><tbody id="jobRows"><tr><td colspan="8">Loading jobs…</td></tr></tbody></table></section></div><script>
const db=window.supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active=[],history=[],driverRows=[],selected=null,currentTab='active';function driverNumber(d,i){const n=d.driver_number??d.number??d.callsign??d.call_sign??d.badge_number;return n?String(n):String(i+1).padStart(2,'0')}function driverById(id){const i=driverRows.findIndex(d=>d.id===id);return i<0?'—':driverNumber(driverRows[i],i)}function driverLat(d){return Number(d.latitude??d.current_latitude)}function driverLng(d){return Number(d.longitude??d.current_longitude)}let map,driverMarkers=new Map(),pickupMarker,destinationMarker,routeLine;function ensureMap(){if(map)return;map=L.map('roadMap').setView([51.1743,-0.1780],12);L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);setTimeout(()=>map.invalidateSize(),200)}function renderDrivers(){const opts=['<option value="">Unassigned</option>'];$('drivers').innerHTML=driverRows.map((d,i)=>{const no=driverNumber(d,i),st=String(d.status||'offline').toLowerCase();opts.push(`<option value="${d.id}">Driver ${esc(no)} — ${esc(st)}</option>`);return `<div class="driver ${esc(st)}"><div class="driverno">${esc(no)}</div><div><b>Driver ${esc(no)}</b><br><span>${esc(st.replaceAll('_',' '))}${d.phone?' • '+esc(d.phone):''}</span></div></div>`}).join('')||'No drivers';$('bookingDriver').innerHTML=opts.join('');renderGps()}function renderGps(){ensureMap();const live=driverRows.filter(d=>Number.isFinite(driverLat(d))&&Number.isFinite(driverLng(d)));const ids=new Set(live.map(d=>String(d.id)));for(const[id,m]of driverMarkers)if(!ids.has(id)){map.removeLayer(m);driverMarkers.delete(id)}live.forEach(d=>{const id=String(d.id),no=driverNumber(d,driverRows.indexOf(d)),pos=[driverLat(d),driverLng(d)];let m=driverMarkers.get(id);if(!m){const icon=L.divIcon({className:'',html:`<div style="background:#1473e6;color:#fff;border:2px solid #fff;border-radius:4px;padding:6px 9px;font-weight:900;box-shadow:0 2px 7px #0006">${esc(no)}</div>`,iconSize:[42,30],iconAnchor:[21,15]});m=L.marker(pos,{icon}).addTo(map);m.bindPopup(`<b>Driver ${esc(no)}</b><br>${esc(d.status||'')}`);driverMarkers.set(id,m)}else m.setLatLng(pos)})}function clearRoute(){if(pickupMarker){map.removeLayer(pickupMarker);pickupMarker=null}if(destinationMarker){map.removeLayer(destinationMarker);destinationMarker=null}if(routeLine){map.removeLayer(routeLine);routeLine=null}}async function showRoute(b){ensureMap();clearRoute();selected=b;$('routeText').innerHTML=`📍 ${esc(b.pickup_address)}<br>🏁 ${esc(b.destination_address)}`;$('routeInfo').textContent='';const p=[Number(b.pickup_latitude),Number(b.pickup_longitude)],d=[Number(b.destination_latitude),Number(b.destination_longitude)];if(!p.every(Number.isFinite)||!d.every(Number.isFinite)){$('routeInfo').textContent='No route coordinates saved for this booking.';return}pickupMarker=L.marker(p).addTo(map);destinationMarker=L.marker(d).addTo(map);try{const r=await fetch(`https://routing.openstreetmap.de/routed-car/route/v1/driving/${p[1]},${p[0]};${d[1]},${d[0]}?overview=full&geometries=geojson`);const data=await r.json();if(!data.routes?.length)throw 0;const rt=data.routes[0];routeLine=L.polyline(rt.geometry.coordinates.map(c=>[c[1],c[0]]),{color:'#1473e6',weight:5}).addTo(map);$('routeInfo').textContent=`${(rt.distance/1609.344).toFixed(1)} miles • about ${Math.round(rt.duration/60)} min`;map.fitBounds(routeLine.getBounds(),{padding:[50,50]})}catch(e){routeLine=L.polyline([p,d],{color:'#1473e6',weight:4,dashArray:'8,7'}).addTo(map);map.fitBounds([p,d],{padding:[50,50]});$('routeInfo').textContent='Pickup and destination shown.'}}function row(b){const t=b.pickup_time?new Date(b.pickup_time).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'NOW',st=String(b.booking_status||'pending');return `<tr onclick="selectJob('${b.id}')"><td>${t}</td><td>${esc(b.id.slice(0,6))}</td><td class="status status-${esc(st)}">${esc(st.replaceAll('_',' ').toUpperCase())}</td><td><b>${esc(driverById(b.driver_id))}</b></td><td>${esc(b.pickup_address)}</td><td>${esc(b.destination_address)}</td><td>${esc(b.passenger_count||1)}</td><td>${b.fare_estimate!=null?'£'+Number(b.fare_estimate).toFixed(2):'—'}</td></tr>`}function prebooked(){return active.filter(b=>b.pickup_time&&new Date(b.pickup_time)>new Date(Date.now()+15*60000))}function renderJobs(){let rows=currentTab==='completed'?history:active;if(currentTab==='prebook')rows=prebooked();$('jobRows').innerHTML=rows.length?rows.map(row).join(''):'<tr><td colspan="8">No jobs.</td></tr>';$('activeCount').textContent=active.length;$('prebookCount').textContent=prebooked().length;$('completedCount').textContent=history.length}window.selectJob=id=>{const b=[...active,...history].find(x=>x.id===id);if(b)showRoute(b)};async function refresh(){const[a,h,d]=await Promise.all([db.rpc('dispatch_get_bookings'),db.rpc('dispatch_get_completed_jobs'),db.rpc('dispatch_get_drivers')]);if(a.error||h.error||d.error)return;active=a.data||[];history=h.data||[];driverRows=d.data||[];renderDrivers();renderJobs()}$('saveBooking').onclick=async()=>{const pickup=$('pickup').value.trim(),destination=$('destination').value.trim();if(!pickup||!destination){$('saveMessage').textContent='Pickup and destination required.';return}$('saveMessage').textContent='Saving…';const payload={pickup_address:pickup,destination_address:destination,pickup_time:$('pickupTime').value?new Date($('pickupTime').value).toISOString():new Date().toISOString(),passenger_count:Number($('passengers').value)||1,fare_estimate:$('fare').value?Number($('fare').value):null,notes:[$('customerName').value&&'Name: '+$('customerName').value,$('phone').value&&'Phone: '+$('phone').value,$('notes').value].filter(Boolean).join(' | '),booking_status:$('bookingDriver').value?'assigned':'pending'};if($('bookingDriver').value)payload.driver_id=$('bookingDriver').value;const r=await db.from('bookings').insert(payload);$('saveMessage').textContent=r.error?'Could not save: '+r.error.message:'Job saved ✓';if(!r.error){['pickup','destination','customerName','phone','notes','fare'].forEach(x=>$(x).value='');$('passengers').value=1;await refresh()}};document.querySelectorAll('.jobtab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.jobtab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTab=b.dataset.tab;renderJobs()});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='history')document.querySelector('[data-tab="completed"]').click();else if(b.dataset.view==='dispatch')document.querySelector('[data-tab="active"]').click();else if(b.dataset.view==='bookings')$('pickup').focus()});setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),1000);ensureMap();db.channel('horley-console').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'drivers'},refresh).subscribe(s=>{if(s==='SUBSCRIBED')$('live').textContent='● LIVE'});refresh();setInterval(refresh,3000);
</script></body></html>
