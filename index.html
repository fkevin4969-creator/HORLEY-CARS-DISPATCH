<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORLEY CARS — Desktop Dispatch</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#e9edf2;color:#111;overflow:hidden}header{height:64px;background:#101827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-size:21px;font-weight:800}.brand small{font-size:11px;font-weight:400;color:#9ca3af;margin-left:8px}.live{background:#374151;padding:7px 11px;border-radius:18px;font-size:12px}.shell{height:calc(100vh - 64px);display:grid;grid-template-columns:370px 1fr 300px;gap:1px;background:#cbd5e1}.panel{background:#f8fafc;overflow:auto}.panel h3{margin:0;padding:14px 15px;border-bottom:1px solid #e5e7eb;background:#fff}.tabs{display:flex;padding:10px;gap:7px;background:#fff;border-bottom:1px solid #e5e7eb}.tab{border:0;border-radius:8px;padding:9px 12px;font-weight:700;background:#e5e7eb;cursor:pointer}.tab.active{background:#2563eb;color:#fff}.jobs{padding:10px;display:grid;gap:9px}.job{background:#fff;border-radius:10px;padding:12px;border-left:5px solid #2563eb;box-shadow:0 1px 4px #0001;cursor:pointer}.job.completed{border-left-color:#6b7280}.top{display:flex;justify-content:space-between;gap:8px}.badge{font-size:10px;font-weight:800;padding:5px 7px;border-radius:12px;background:#dbeafe;color:#1d4ed8;height:max-content}.route{font-size:13px;line-height:1.55;margin-top:8px}.meta{font-size:11px;color:#6b7280;margin-top:7px}.center{background:#dbe4ea;position:relative;overflow:hidden}.map{height:100%;min-height:100%;position:relative}.mapcard{position:absolute;z-index:500;left:24px;top:24px;background:#fff;border-radius:14px;padding:18px;width:min(520px,calc(100% - 48px));box-shadow:0 8px 28px #0002}.mapcard h2{margin:0 0 14px}.pin{margin:12px 0;font-size:15px}.mapnote{font-size:12px;color:#64748b;margin-top:12px}.routeinfo{font-size:12px;font-weight:700;color:#1d4ed8;margin-top:10px}.drivers{padding:10px;display:grid;gap:9px}.driver{background:#fff;padding:12px;border-radius:10px;box-shadow:0 1px 4px #0001}.driver b{display:block}.driver span{font-size:12px;color:#64748b}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px}.assignbox{margin-top:18px;border-top:1px solid #e5e7eb;padding-top:14px}.assignbox select,.assignbox button{width:100%;padding:11px;border-radius:8px;margin-top:7px}.assignbox select{border:1px solid #d1d5db;background:#fff}.assignbox button{border:0;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.empty{padding:22px;text-align:center;color:#64748b}.hidden{display:none}@media(max-width:900px){body{overflow:auto}.shell{height:auto;grid-template-columns:1fr}.center{min-height:430px}.panel{max-height:none}}</style></head><body><header><div class="brand">HORLEY CARS <small>DESKTOP DISPATCH</small></div><span id="live" class="live">CONNECTING…</span></header><div class="shell"><section class="panel"><div class="tabs"><button id="activeTab" class="tab active">Active Jobs</button><button id="historyTab" class="tab">History</button></div><div id="activeJobs" class="jobs"><div class="empty">Loading jobs…</div></div><div id="historyJobs" class="jobs hidden"><div class="empty">Loading history…</div></div></section><section class="center"><div class="map"><div id="roadMap" style="position:absolute;inset:0;z-index:0"></div><div class="mapcard"><h2 id="detailTitle">Select a job</h2><div class="pin">📍 <span id="detailPickup">Choose a booking from the left.</span></div><div class="pin">🏁 <span id="detailDestination">—</span></div><div id="detailStatus" class="meta"></div><div id="routeInfo" class="routeinfo"></div><div class="assignbox" id="assignBox" style="display:none"><b>Assign driver</b><select id="driverSelect"></select><button id="assignButton">Assign Driver</button><div id="assignMessage" class="meta"></div></div><div class="mapnote">Live road map • Pickup → destination route • Live driver GPS.</div></div></div></section><section class="panel"><h3>Drivers</h3><div id="drivers" class="drivers"><div class="empty">Loading drivers…</div></div></section></div><script>
const db=window.supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp');let active=[],history=[],driverRows=[],selected=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function refresh(){const[a,h,d]=await Promise.all([db.rpc('dispatch_get_bookings'),db.rpc('dispatch_get_completed_jobs'),db.rpc('dispatch_get_drivers')]);if(a.error||h.error||d.error){$('activeJobs').innerHTML='<div class="empty">Unable to load dispatch data.</div>';return}active=a.data||[];history=h.data||[];driverRows=d.data||[];render();if(selected){const fresh=[...active,...history].find(x=>x.id===selected.id);if(fresh)updateDetail(fresh);else clearDetail()}}function card(b,c=false){return `<div class="job ${c?'completed':''}" onclick="selectById('${b.id}')"><div class="top"><b>${esc(b.pickup_address)}</b><span class="badge">${esc(b.booking_status).replaceAll('_',' ').toUpperCase()}</span></div><div class="route">📍 ${esc(b.pickup_address)}<br>🏁 ${esc(b.destination_address)}</div><div class="meta">${esc(b.id.slice(0,8))}… • ${esc(b.passenger_count)} passenger</div></div>`}function render(){$('activeJobs').innerHTML=active.length?active.map(b=>card(b)).join(''):'<div class="empty">No active jobs.</div>';$('historyJobs').innerHTML=history.length?history.map(b=>card(b,true)).join(''):'<div class="empty">No completed jobs.</div>';$('drivers').innerHTML=driverRows.length?driverRows.map(d=>`<div class="driver"><b><span class="dot"></span>${esc(d.full_name)}</b><span>${esc(d.phone||'')} • ${esc(d.status)}</span></div>`).join(''):'<div class="empty">No drivers.</div>';renderDriverGps()}
function driverLat(d){return Number(d.latitude??d.current_latitude)}function driverLng(d){return Number(d.longitude??d.current_longitude)}let roadMap=null,baseLayer=null,tileFallbackUsed=false,driverMarkers=new Map(),mapHasFitted=false,pickupMarker=null,destinationMarker=null,routeLine=null,routeRequest=0;function addBase(url,attr){baseLayer=L.tileLayer(url,{maxZoom:19,attribution:attr,crossOrigin:true}).addTo(roadMap);baseLayer.on('tileerror',()=>{if(tileFallbackUsed)return;tileFallbackUsed=true;roadMap.removeLayer(baseLayer);baseLayer=L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{maxZoom:20,subdomains:'abc',attribution:'&copy; OpenStreetMap contributors, OSM France'}).addTo(roadMap)})}function ensureRoadMap(){if(roadMap||!window.L)return;roadMap=L.map('roadMap',{zoomControl:true}).setView([51.1743,-0.1780],12);addBase('https://tile.openstreetmap.de/{z}/{x}/{y}.png','&copy; OpenStreetMap contributors');setTimeout(()=>roadMap.invalidateSize(),250);window.addEventListener('resize',()=>roadMap.invalidateSize())}function renderDriverGps(){ensureRoadMap();if(!roadMap)return;const live=driverRows.filter(d=>Number.isFinite(driverLat(d))&&Number.isFinite(driverLng(d)));const ids=new Set(live.map(d=>String(d.id)));for(const[id,m]of driverMarkers){if(!ids.has(id)){roadMap.removeLayer(m);driverMarkers.delete(id)}}live.forEach(d=>{const id=String(d.id),pos=[driverLat(d),driverLng(d)];let m=driverMarkers.get(id);if(!m){const icon=L.divIcon({className:'',html:`<div style="background:#0757b9;color:white;border:3px solid white;border-radius:999px;padding:7px 10px;box-shadow:0 4px 14px #0005;font-weight:800;white-space:nowrap">🚕 ${esc(d.full_name)}</div>`,iconSize:[150,38],iconAnchor:[75,19]});m=L.marker(pos,{icon}).addTo(roadMap);m.bindPopup(`<b>${esc(d.full_name)}</b><br>${driverLat(d).toFixed(6)}, ${driverLng(d).toFixed(6)}<br>Status: ${esc(d.status)}`);driverMarkers.set(id,m)}else m.setLatLng(pos)});if(live.length&&!mapHasFitted&&!selected){if(live.length===1)roadMap.setView([driverLat(live[0]),driverLng(live[0])],15);else roadMap.fitBounds(live.map(d=>[driverLat(d),driverLng(d)]),{padding:[60,60]});mapHasFitted=true}}
function clearJobMarkers(){if(pickupMarker&&roadMap){roadMap.removeLayer(pickupMarker);pickupMarker=null}if(destinationMarker&&roadMap){roadMap.removeLayer(destinationMarker);destinationMarker=null}if(routeLine&&roadMap){roadMap.removeLayer(routeLine);routeLine=null}$('routeInfo').textContent=''}function straightFallback(p,d){routeLine=L.polyline([p,d],{color:'#2563eb',weight:5,opacity:.65,dashArray:'10,8'}).addTo(roadMap);roadMap.fitBounds([p,d],{padding:[80,80],maxZoom:15});const m=roadMap.distance(p,d)/1609.344;$('routeInfo').textContent=`Route service unavailable • ${m.toFixed(1)} miles straight-line shown`}
async function tryRoute(url){const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(String(r.status));const data=await r.json();if(!data.routes?.length)throw new Error('no route');return data.routes[0]}
async function drawDrivingRoute(p,d){const req=++routeRequest;$('routeInfo').textContent='Finding driving route…';const urls=[`https://router.project-osrm.org/route/v1/driving/${p[1]},${p[0]};${d[1]},${d[0]}?overview=full&geometries=geojson`,`https://routing.openstreetmap.de/routed-car/route/v1/driving/${p[1]},${p[0]};${d[1]},${d[0]}?overview=full&geometries=geojson`];for(const url of urls){try{const route=await tryRoute(url);if(req!==routeRequest)return;const latlngs=route.geometry.coordinates.map(c=>[c[1],c[0]]);routeLine=L.polyline(latlngs,{color:'#2563eb',weight:6,opacity:.82}).addTo(roadMap);$('routeInfo').textContent=`🚕 Driving route: ${(route.distance/1609.344).toFixed(1)} miles • about ${Math.round(route.duration/60)} min`;roadMap.fitBounds(routeLine.getBounds(),{padding:[70,70],maxZoom:15});return}catch(e){console.warn('Route provider failed',e)}}if(req===routeRequest)straightFallback(p,d)}
function showJobMarkers(b){ensureRoadMap();if(!roadMap||!b)return;clearJobMarkers();const p=[Number(b.pickup_latitude),Number(b.pickup_longitude)],d=[Number(b.destination_latitude),Number(b.destination_longitude)];const pv=p.every(Number.isFinite),dv=d.every(Number.isFinite);if(pv)pickupMarker=L.marker(p).addTo(roadMap).bindPopup('<b>📍 Pickup</b><br>'+esc(b.pickup_address));if(dv)destinationMarker=L.marker(d).addTo(roadMap).bindPopup('<b>🏁 Destination</b><br>'+esc(b.destination_address));if(pv&&dv)drawDrivingRoute(p,d);else if(pv)roadMap.setView(p,15);else if(dv)roadMap.setView(d,15);else $('routeInfo').textContent='No map coordinates saved for this booking.'}function selectById(id){const b=[...active,...history].find(x=>x.id===id);if(b)selectJob(b)}function updateDetail(b){selected=b;$('detailTitle').textContent='Booking '+b.id.slice(0,8)+'…';$('detailPickup').textContent=b.pickup_address;$('detailDestination').textContent=b.destination_address;$('detailStatus').textContent='Status: '+b.booking_status.replaceAll('_',' ').toUpperCase()+' • '+b.passenger_count+' passenger';const ok=['pending','assigned'].includes(b.booking_status);$('assignBox').style.display=ok?'block':'none';if(ok){$('driverSelect').innerHTML='<option value="">Choose driver…</option>'+driverRows.map(d=>`<option value="${d.id}" ${d.id===b.driver_id?'selected':''}>${esc(d.full_name)} — ${esc(d.status)}</option>`).join('');$('assignButton').textContent=b.driver_id?'Reassign Driver':'Assign Driver'}}function selectJob(b){updateDetail(b);showJobMarkers(b)}function clearDetail(){selected=null;routeRequest++;clearJobMarkers();$('detailTitle').textContent='Select a job';$('detailPickup').textContent='Choose a booking from the left.';$('detailDestination').textContent='—';$('detailStatus').textContent='';$('assignBox').style.display='none'}$('assignButton').onclick=async()=>{if(!selected||!$('driverSelect').value)return;$('assignMessage').textContent='Assigning…';const r=await db.rpc('dispatch_assign_driver',{p_booking_id:selected.id,p_driver_id:$('driverSelect').value});$('assignMessage').textContent=r.error?'Failed: '+r.error.message:'Driver assigned ✓';if(!r.error)await refresh()};$('activeTab').onclick=()=>{$('activeTab').classList.add('active');$('historyTab').classList.remove('active');$('activeJobs').classList.remove('hidden');$('historyJobs').classList.add('hidden')};$('historyTab').onclick=()=>{$('historyTab').classList.add('active');$('activeTab').classList.remove('active');$('historyJobs').classList.remove('hidden');$('activeJobs').classList.add('hidden')};db.channel('horley-cars-desktop').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'drivers'},refresh).subscribe(s=>{if(s==='SUBSCRIBED'){$('live').textContent='● LIVE';$('live').style.background='#16a34a'}});refresh();let refreshBusy=false;async function fallbackRefresh(){if(refreshBusy)return;refreshBusy=true;try{await refresh()}catch(e){console.warn('HORLEY CARS fallback refresh',e)}finally{refreshBusy=false}}setInterval(fallbackRefresh,2000);window.addEventListener('focus',fallbackRefresh);window.addEventListener('online',fallbackRefresh);</script></body></html>
