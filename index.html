lass="live">CONNECTING</span></div><div class="work"><section class="box booking"><div class="head">NEW BOOKING</div><div class="row"><label>DATE</label><input id="time" type="datetime-local"></div><div class="row"><label>ADDR</label><input id="pickup" placeholder="Pickup address / postcode"></div><div class="row"><label>DEST</label><input id="dest" placeholder="Destination address / postcode"></div><div class="row"><label>NAME</label><input id="name" placeholder="Customer name"></div><div class="row"><label>PHONE</label><input id="phone" placeholder="Phone number"></div><div class="two"><div class="row"><label>PPL</label><input id="ppl" type="number" min="1" value="1"></div><div class="row"><label>DRV</label><select id="newDriver"><option value="">Unassigned</option></select></div></div><div class="row"><label>FARE</label><input id="fare" type="number" min="0" step=".01"></div><div class="row"><label>NOTES</label><input id="notes"></div><button id="save" class="save">SAVE JOB</button><div id="saveMsg" class="msg"></div></section><section class="box mapbox"><div id="map" class="map"></div><div class="route"><b>LIVE DISPATCH MAP</b><div id="routeText">Select a job below.</div><div id="routeInfo" class="msg"></div></div><div id="controls" class="controls"><b id="controlTitle">SELECTED JOB</b><select id="controlDriver"></select><div class="actions"><button id="assign" class="assignbtn">ASSIGN DRIVER</button><button id="arrive" class="arrivebtn">ARRIVED</button><button id="pob" class="pobbtn">PASSENGER ON BOARD</button><button id="complete" class="completebtn">COMPLETE</button></div><div id="controlMsg" class="msg"></div></div></section><section class="box drivers"><div class="head">DRIVERS — NUMBER / STATUS</div><div id="driverGrid" class="drivergrid"></div></section><section class="box jobs"><div class="tabs"><button class="tab active" data-tab="active">DISPATCH <span id="ac">0</span></button><button class="tab" data-tab="pre">PRE-BOOKED <span id="pc">0</span></button><button class="tab" data-tab="done">COMPLETED <span id="cc">0</span></button></div><table><thead><tr><th>Time</th><th>Ref</th><th>Status</th><th>Drv</th><th>Pickup</th><th>Destination</th><th>P</th><th>Fare</th></tr></thead><tbody id="jobs"></tbody></table></section></div><script>const db=supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp'),$=x=>document.getElementById(x);let A=[],H=[],D=[],S=null,T='active';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function num(d,i){return String(d.driver_number??d.number??d.callsign??d.call_sign??d.badge_number??i+1).padStart(2,'0')}function dnum(id){let i=D.findIndex(x=>x.id===id);return i<0?'—':num(D[i],i)}function lat(d){return Number(d.latitude??d.current_latitude)}function lng(d){return Number(d.longitude??d.current_longitude)}let M,marks=new Map(),pm,dm,line;function initMap(){if(M)return;M=L.map('map').setView([51.1743,-.178],12);L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(M)}function drivers(){let o='<option value="">Choose driver…</option>';$('driverGrid').innerHTML=D.map((d,i)=>{let n=num(d,i),s=String(d.status||'offline').toLowerCase();o+=`<option value="${d.id}">Driver ${e(n)}</option>`;return `<div class="driver ${e(s)}"><div class="dn">${e(n)}</div><div><b>Driver ${e(n)}</b><br><small>${e(s.replaceAll('_',' '))}</small></div></div>`}).join('');$('newDriver').innerHTML='<option value="">Unassigned</option>'+o.replace('<option value="">Choose driver…</option>','');$('controlDriver').innerHTML=o;gps()}function gps(){initMap();let live=D.filter(d=>Number.isFinite(lat(d))&&Number.isFinite(lng(d))),ids=new Set(live.map(d=>String(d.id)));for(let[id,m]of marks)if(!ids.has(id)){M.removeLayer(m);marks.delete(id)}live.forEach(d=>{let id=String(d.id),n=num(d,D.indexOf(d)),p=[lat(d),lng(d)],m=marks.get(id);if(!m){let ic=L.divIcon({className:'',html:`<div style="background:#1473e6;color:#fff;border:2px solid #fff;padding:6px 9px;font-weight:900">${e(n)}</div>`,iconSize:[42,30]});m=L.marker(p,{icon:ic}).addTo(M);marks.set(id,m)}else m.setLatLng(p)})}function clearRoute(){[pm,dm,line].forEach(x=>x&&M.removeLayer(x));pm=dm=line=null}async function route(b){initMap();clearRoute();$('routeText').innerHTML=`📍 ${e(b.pickup_address)}<br>🏁 ${e(b.destination_address)}`;let p=[+b.pickup_latitude,+b.pickup_longitude],d=[+b.destination_latitude,+b.destination_longitude];if(!p.every(Number.isFinite)||!d.every(Number.isFinite)){ $('routeInfo').textContent='No route coordinates saved.';return}pm=L.marker(p).addTo(M);dm=L.marker(d).addTo(M);try{let r=await fetch(`https://routing.openstreetmap.de/routed-car/route/v1/driving/${p[1]},${p[0]};${d[1]},${d[0]}?overview=full&geometries=geojson`),j=await r.json(),q=j.routes[0];line=L.polyline(q.geometry.coordinates.map(c=>[c[1],c[0]]),{color:'#1473e6',weight:5}).addTo(M);$('routeInfo').textContent=`${(q.distance/1609.344).toFixed(1)} miles • ${Math.round(q.duration/60)} min`;M.fitBounds(line.getBounds(),{padding:[50,50]})}catch{x=L.polyline([p,d],{dashArray:'8,7'}).addTo(M);M.fitBounds([p,d])}}function select(id){S=[...A,...H].find(x=>x.id===id);if(!S)return;route(S);$('controls').style.display='block';$('controlTitle').textContent='JOB '+S.id.slice(0,8)+' • '+String(S.booking_status).replaceAll('_',' ').toUpperCase();$('controlDriver').value=S.driver_id||'';buttons()}window.select=select;function buttons(){let s=S?.booking_status||'';$('assign').disabled=!S||s==='completed';$('arrive').disabled=!['assigned','accepted'].includes(s);$('pob').disabled=s!=='arrived';$('complete').disabled=s!=='passenger_on_board'}function row(b){let s=String(b.booking_status||'pending'),t=b.pickup_time?new Date(b.pickup_time).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'NOW';return `<tr class="${S?.id===b.id?'sel':''}" onclick="select('${b.id}')"><td>${t}</td><td>${e(b.id.slice(0,6))}</td><td class="status ${e(s)}">${e(s.replaceAll('_',' ').toUpperCase())}</td><td><b>${e(dnum(b.driver_id))}</b></td><td>${e(b.pickup_address)}</td><td>${e(b.destination_address)}</td><td>${e(b.passenger_count||1)}</td><td>${b.fare_estimate!=null?'£'+(+b.fare_estimate).toFixed(2):'—'}</td></tr>`}function pre(){return A.filter(b=>b.pickup_time&&new Date(b.pickup_time)>new Date(Date.now()+9e5))}function render(){let r=T==='done'?H:T==='pre'?pre():A;$('jobs').innerHTML=r.length?r.map(row).join(''):'<tr><td colspan="8">No jobs.</td></tr>';$('ac').textContent=A.length;$('pc').textContent=pre().length;$('cc').textContent=H.length;drivers()}async function refresh(){let[a,h,d]=await Promise.all([db.rpc('dispatch_get_bookings'),db.rpc('dispatch_get_completed_jobs'),db.rpc('dispatch_get_drivers')]);if(a.error||h.error||d.error)return;A=a.data||[];H=h.data||[];D=d.data||[];if(S){let f=[...A,...H].find(x=>x.id===S.id);if(f){S=f;$('controlDriver').value=S.driver_id||'';$('controlTitle').textContent='JOB '+S.id.slice(0,8)+' • '+String(S.booking_status).replaceAll('_',' ').toUpperCase();buttons()}else{$('controls').style.display='none';S=null}}render()}async function assign(){if(!S||!$('controlDriver').value)return;$('controlMsg').textContent='Assigning…';let r=await db.rpc('dispatch_assign_driver',{p_booking_id:S.id,p_driver_id:$('controlDriver').value});$('controlMsg').textContent=r.error?'Failed: '+r.error.message:'Driver assigned ✓';if(!r.error)await refresh()}async function status(s){if(!S)return;$('controlMsg').textContent='Updating…';let r=await db.from('bookings').update({booking_status:s,updated_at:new Date().toISOString()}).eq('id',S.id);$('controlMsg').textContent=r.error?'Failed: '+r.error.message:(s==='completed'?'Job completed ✓':'Status updated ✓');if(!r.error){await refresh();if(s==='completed'){$('controls').style.display='none';clearRoute();S=null}}}$('assign').onclick=assign;$('arrive').onclick=()=>status('arrived');$('pob').onclick=()=>status('passenger_on_board');$('complete').onclick=()=>status('completed');$('save').onclick=async()=>{if(!$('pickup').value.trim()||!$('dest').value.trim()){ $('saveMsg').textContent='Pickup and destination required.';return}let p={pickup_address:$('pickup').value.trim(),destination_address:$('dest').value.trim(),pickup_time:$('time').value?new Date($('time').value).toISOString():new Date().toISOString(),passenger_count:+$('ppl').value||1,fare_estimate:$('fare').value?+$('fare').value:null,notes:[$('name').value&&'Name: '+$('name').value,$('phone').value&&'Phone: '+$('phone').value,$('notes').value].filter(Boolean).join(' | '),booking_status:$('newDriver').value?'assigned':'pending'};if($('newDriver').value)p.driver_id=$('newDriver').value;let r=await db.from('bookings').insert(p);$('saveMsg').textContent=r.error?'Could not save: '+r.error.message:'Job saved ✓';if(!r.error)refresh()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');T=b.dataset.tab;render()});$('historyNav').onclick=()=>document.querySelector('[data-tab="done"]').click();setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),1000);initMap();db.channel('horley-console').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'drivers'},refresh).subscribe(s=>{if(s==='SUBSCRIBED')$('live').textContent='● LIVE'});refresh();setInterval(refresh,3000)</script></body></html>
