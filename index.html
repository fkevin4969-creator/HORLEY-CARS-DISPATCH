<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORLEY CARS — Dispatch Console</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
*{box-sizing:border-box}body{margin:0;font:13px Arial,sans-serif;background:#c9ced3;color:#20252a;overflow:hidden}.topbar{height:42px;background:#34383d;color:#fff;display:flex;align-items:center;gap:5px;padding:5px 8px}.logo{font-size:18px;font-weight:900;margin-right:12px}.nav{border:0;background:#555b61;color:#fff;padding:8px 11px;font-weight:800;cursor:pointer}.nav.active{background:#1473e6}.spacer{flex:1}.live{background:#16a34a;border-radius:12px;padding:5px 10px;font-weight:800}.workspace{height:calc(100vh - 42px);display:grid;grid-template-columns:335px 1fr 255px;grid-template-rows:330px 1fr;gap:5px;padding:5px}.box{background:#f4f5f6;border:1px solid #999;min-width:0}.boxhead{background:#5a5f64;color:#fff;padding:7px 9px;font-weight:800}.booking{grid-column:1;grid-row:1;padding:7px}.formrow{display:grid;grid-template-columns:54px 1fr;gap:5px;align-items:center;margin:5px 0}.formrow label{font-weight:800;color:#555}.formrow input,.formrow select{width:100%;height:28px;border:1px solid #bbb;padding:4px;background:#fff}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:5px}.save{width:100%;height:34px;border:0;background:#4b5156;color:#fff;font-weight:900;margin-top:7px;cursor:pointer}.mapbox{grid-column:2;grid-row:1;position:relative}.map{position:absolute;inset:0}.maptools{position:absolute;z-index:500;left:10px;bottom:10px;background:#fff;padding:6px 9px;border:1px solid #999;font-weight:700}.driversbox{grid-column:3;grid-row:1/3;overflow:auto}.drivergrid{padding:7px;display:grid;gap:5px}.driver{background:#fff;border:1px solid #bbb;padding:8px;display:grid;grid-template-columns:45px 1fr;gap:8px;align-items:center}.driverno{font-size:20px;font-weight:900;text-align:center;background:#1473e6;color:#fff;padding:9px 2px}.driver.available .driverno{background:#159447}.driver.busy .driverno{background:#e0a100}.driver span{font-size:11px;color:#666}.jobsbox{grid-column:1/3;grid-row:2;overflow:auto}.jobtabs{display:flex;background:#ddd;border-bottom:1px solid #999}.jobtab{padding:8px 13px;border:0;border-right:1px solid #aaa;background:#ddd;font-weight:800;cursor:pointer}.jobtab.active{background:#fff}.jobtable{width:100%;border-collapse:collapse;background:#fff;font-size:12px}.jobtable th{position:sticky;top:0;background:#555;color:#fff;padding:6px;text-align:left}.jobtable td{padding:6px;border-bottom:1px solid #ddd;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}.jobtable tr{cursor:pointer}.jobtable tr:hover{background:#e7f1ff}.status{font-weight:800}.routepanel{position:absolute;z-index:500;top:8px;left:8px;max-width:380px;background:#fff;padding:9px 11px;border:1px solid #aaa;box-shadow:0 2px 8px #0003}.routepanel b{display:block;margin-bottom:4px}.routeinfo{color:#1464c8;font-weight:800;margin-top:4px}.hidden{display:none}@media(max-width:900px){body{overflow:auto}.workspace{height:auto;display:block}.box{margin-bottom:6px}.mapbox{height:420px}.driversbox{max-height:350px}}
</style></head><body><div class="topbar"><div class="logo">HORLEY CARS</div><button class="nav active" data-view="dispatch">DISPATCH</button><button class="nav" data-view="bookings">BOOKINGS</button><button class="nav" data-view="drivers">DRIVERS</button><button class="nav" data-view="history">HISTORY</button><button class="nav" data-view="logs">LOGS</button><div class="spacer"></div><span id="clock"></span><span id="live" class="live">CONNECTING</span></div>
<div class="workspace"><section class="box booking"><div class="boxhead">NEW BOOKING</div><div class="formrow"><label>DATE</label><input id="pickupTime" type="datetime-local"></div><div class="formrow"><label>ADDR</label><input id="pickup" placeholder="Pickup address"></div><div class="formrow"><label>DEST</label><input id="destination" placeholder="Destination address"></div><div class="formrow"><label>NAME</label><input id="customerName" placeholder="Customer name"></div><div class="formrow"><label>PHONE</label><input id="phone" placeholder="Phone number"></div><div class="twocol"><div class="formrow"><label>PPL</label><input id="passengers" type="number" min="1" value="1"></div><div class="formrow"><label>DRV</label><select id="bookingDriver"><option value="">Unassigned</option></select></div></div><div class="formrow"><label>NOTES</label><input id="notes" placeholder="Booking notes"></div><button id="saveBooking" class="save">SAVE JOB</button><div id="saveMessage"></div></section>
<section class="box mapbox"><div id="roadMap" class="map"></div><div id="routePanel" class="routepanel"><b>LIVE DISPATCH MAP</b><div id="routeText">Select a job below to view pickup and destination.</div><div id="routeInfo" class="routeinfo"></div></div><div class="maptools">Horley • Gatwick • Live Driver GPS</div></section>
<section class="box driversbox"><div class="boxhead">DRIVERS</div><div id="drivers" class="drivergrid">Loading drivers…</div></section>
<section class="box jobsbox"><div class="jobtabs"><button class="jobtab active" data-tab="active">DISPATCH <span id="activeCount">0</span></button><button class="jobtab" data-tab="prebook">PRE-BOOKED</button><button class="jobtab" data-tab="completed">COMPLETED <span id="completedCount">0</span></button></div><table class="jobtable"><thead><tr><th>Time</th><th>Ref</th><th>Status</th><th>Drv</th><th>Pickup</th><th>Destination</th><th>P</th><th>Fare</th></tr></thead><tbody id="jobRows"><tr><td colspan="8">Loading jobs…</td></tr></tbody></table></section></div>
<script>
const db=window.supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active=[],history=[],driverRows=[],selected=null,currentTab='active';function driverNumber(d,i){const n=d.driver_number??d.number??d.callsign??d.call_sign??d.badge_number;return n?String(n):String(i+1).padStart(2,'0')}function driverById(id){const i=driverRows.findIndex(d=>d.id===id);return i<0?'—':driverNumber(driverRows[i],i)}function driverLat(d){return Number(d.latitude??d.current_latitude)}function driverLng(d){return Number(d.longitude??d.current_longitude)}
let map,driverMarkers=new Map(),pickupMarker,destinationMarker,routeLine;function ensureMap(){if(map)return;map=L.map('roadMap').setView([51.1743,-0.1780],12);L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);setTimeout(()=>map.invalidateSize(),200)}function renderDrivers(){const opts=['<option value="">Unassigned</option>'];$('drivers').innerHTML=driverRows.map((d,i)=>{const no=driverNumber(d,i);opts.push(`<option value="${d.id}">Driver ${esc(no)}</option>`);return `<div class="driver ${esc(d.status||'')}"><div class="driverno">${esc(no)}</div><div><b>Driver ${esc(no)}</b><br><span>${esc(d.status||'unknown')} ${d.phone?'• '+esc(d.phone):''}</span></div></div>`}).join('')||'No drivers';$('bookingDriver').innerHTML=opts.join('');renderGps()}function renderGps(){ensureMap();const live=driverRows.filter(d=>Number.isFinite(driverLat(d))&&Number.isFinite(driverLng(d)));const ids=new Set(live.map(d=>String(d.id)));for(const[id,m]of driverMarkers)if(!ids.has(id)){map.removeLayer(m);driverMarkers.delete(id)}live.forEach((d,i)=>{const id=String(d.id),no=driverNumber(d,driverRows.indexOf(d)),pos=[driverLat(d),driverLng(d)];let m=driverMarkers.get(id);if(!m){const icon=L.divIcon({className:'',html:`<div style="background:#1473e6;color:#fff;border:2px solid #fff;border-radius:4px;padding:5px 8px;font-weight:900;box-shadow:0 2px 7px #0006">${esc(no)}</div>`,iconSize:[38,28],iconAnchor:[19,14]});m=L.marker(pos,{icon}).addTo(map);m.bindPopup(`<b>Driver ${esc(no)}</b><br>${esc(d.status||'')}`);driverMarkers.set(id,m)}else m.setLatLng(pos)})}
function clearRoute(){if(pickupMarker){map.removeLayer(pickupMarker);pickupMarker=null}if(destinationMarker){map.removeLayer(destinationMarker);destinationMarker=null}if(routeLine){map.removeLayer(routeLine);routeLine=null}}async function showRoute(b){ensureMap();clearRoute();selected=b;$('routeText').innerHTML=`📍 ${esc(b.pickup_address)}<br>🏁 ${esc(b.destination_address)}`;$('routeInfo').textContent='';const p=[Number(b.pickup_latitude),Number(b.pickup_longitude)],d=[Number(b.destination_latitude),Number(b.destination_longitude)];if(!p.every(Number.isFinite)||!d.every(Number.isFinite)){$('routeInfo').textContent='No route coordinates saved for this booking.';return}pickupMarker=L.marker(p).addTo(map);destinationMarker=L.marker(d).addTo(map);try{const r=await fetch(`https://routing.openstreetmap.de/routed-car/route/v1/driving/${p[1]},${p[0]};${d[1]},${d[0]}?overview=full&geometries=geojson`);const data=await r.json();if(!data.routes?.length)throw 0;const rt=data.routes[0];routeLine=L.polyline(rt.geometry.coordinates.map(c=>[c[1],c[0]]),{color:'#1473e6',weight:5}).addTo(map);$('routeInfo').textContent=`${(rt.distance/1609.344).toFixed(1)} miles • about ${Math.round(rt.duration/60)} min`;map.fitBounds(routeLine.getBounds(),{padding:[50,50]})}catch(e){routeLine=L.polyline([p,d],{color:'#1473e6',weight:4,dashArray:'8,7'}).addTo(map);map.fitBounds([p,d],{padding:[50,50]});$('routeInfo').textContent='Pickup and destination shown.'}}
function row(b){const t=b.pickup_time?new Date(b.pickup_time).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'NOW';return `<tr onclick="selectJob('${b.id}')"><td>${t}</td><td>${esc(b.id.slice(0,6))}</td><td class="status">${esc(b.booking_status).replaceAll('_',' ').toUpperCase()}</td><td>${esc(driverById(b.driver_id))}</td><td>${esc(b.pickup_address)}</td><td>${esc(b.destination_address)}</td><td>${esc(b.passenger_count||1)}</td><td>${b.fare_estimate!=null?'£'+Number(b.fare_estimate).toFixed(2):'—'}</td></tr>`}function renderJobs(){let rows=currentTab==='completed'?history:active;if(currentTab==='prebook')rows=active.filter(b=>b.pickup_time&&new Date(b.pickup_time)>new Date(Date.now()+15*60000));$('jobRows').innerHTML=rows.length?rows.map(row).join(''):'<tr><td colspan="8">No jobs.</td></tr>';$('activeCount').textContent=active.length;$('completedCount').textContent=history.length}window.selectJob=id=>{const b=[...active,...history].find(x=>x.id===id);if(b)showRoute(b)};
async function refresh(){const[a,h,d]=await Promise.all([db.rpc('dispatch_get_bookings'),db.rpc('dispatch_get_completed_jobs'),db.rpc('dispatch_get_drivers')]);if(a.error||h.error||d.error)return;active=a.data||[];history=h.data||[];driverRows=d.data||[];renderDrivers();renderJobs()}
$('saveBooking').onclick=async()=>{const pickup=$('pickup').value.trim(),destination=$('destination').value.trim();if(!pickup||!destination){$('saveMessage').textContent='Pickup and destination required.';return}$('saveMessage').textContent='Saving…';const payload={pickup_address:pickup,destination_address:destination,pickup_time:$('pickupTime').value?new Date($('pickupTime').value).toISOString():new Date().toISOString(),passenger_count:Number($('passengers').value)||1,notes:[ $('customerName').value&&'Name: '+$('customerName').value,$('phone').value&&'Phone: '+$('phone').value,$('notes').value].filter(Boolean).join(' | '),booking_status:$('bookingDriver').value?'assigned':'pending'};if($('bookingDriver').value)payload.driver_id=$('bookingDriver').value;const r=await db.from('bookings').insert(payload);$('saveMessage').textContent=r.error?'Could not save: '+r.error.message:'Job saved ✓';if(!r.error){$('pickup').value='';$('destination').value='';await refresh()}};
document.querySelectorAll('.jobtab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.jobtab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTab=b.dataset.tab;renderJobs()});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='history'){currentTab='completed';document.querySelector('[data-tab="completed"]').click()}else if(b.dataset.view==='drivers')document.querySelector('.driversbox').scrollIntoView({behavior:'smooth'});else if(b.dataset.view==='bookings')document.querySelector('.booking').scrollIntoView({behavior:'smooth'})});setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),1000);ensureMap();db.channel('horley-console').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'drivers'},refresh).subscribe(s=>{if(s==='SUBSCRIBED')$('live').textContent='● LIVE'});refresh();setInterval(refresh,3000);
</script></body></html>
