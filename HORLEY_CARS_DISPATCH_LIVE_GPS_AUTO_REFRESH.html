<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARLINE DSM — Desktop Dispatch</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#e9edf2;color:#111;overflow:hidden}
header{height:64px;background:#101827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-size:21px;font-weight:800}.brand small{font-size:11px;font-weight:400;color:#9ca3af;margin-left:8px}
.live{background:#374151;padding:7px 11px;border-radius:18px;font-size:12px}
.shell{height:calc(100vh - 64px);display:grid;grid-template-columns:370px 1fr 300px;gap:1px;background:#cbd5e1}
.panel{background:#f8fafc;overflow:auto}.panel h3{margin:0;padding:14px 15px;border-bottom:1px solid #e5e7eb;background:#fff}
.tabs{display:flex;padding:10px;gap:7px;background:#fff;border-bottom:1px solid #e5e7eb}.tab{border:0;border-radius:8px;padding:9px 12px;font-weight:700;background:#e5e7eb;cursor:pointer}.tab.active{background:#2563eb;color:#fff}
.jobs{padding:10px;display:grid;gap:9px}.job{background:#fff;border-radius:10px;padding:12px;border-left:5px solid #2563eb;box-shadow:0 1px 4px #0001;cursor:pointer}
.job.completed{border-left-color:#6b7280}.top{display:flex;justify-content:space-between;gap:8px}.badge{font-size:10px;font-weight:800;padding:5px 7px;border-radius:12px;background:#dbeafe;color:#1d4ed8;height:max-content}.route{font-size:13px;line-height:1.55;margin-top:8px}.meta{font-size:11px;color:#6b7280;margin-top:7px}
.center{background:#dbe4ea;position:relative;overflow:auto}.map{min-height:100%;background:linear-gradient(135deg,#dbe4ea,#eef2f7);position:relative;padding:24px}
.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#94a3b820 1px,transparent 1px),linear-gradient(90deg,#94a3b820 1px,transparent 1px);background-size:42px 42px}
.mapcard{position:relative;z-index:2;background:#fff;border-radius:14px;padding:18px;max-width:520px;box-shadow:0 8px 28px #0002}
.gps-layer{position:absolute;inset:0;z-index:1;pointer-events:none}
.driver-marker{position:absolute;transform:translate(-50%,-50%);background:#0757b9;color:#fff;border:3px solid #fff;border-radius:999px;padding:8px 11px;box-shadow:0 5px 16px #0004;font-size:12px;font-weight:800;white-space:nowrap}
.driver-marker .car{font-size:20px;margin-right:5px}.gps-legend{position:absolute;right:14px;bottom:14px;z-index:3;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 2px 10px #0002;font-size:11px;color:#475569}
.mapcard h2{margin:0 0 14px}.pin{margin:12px 0;font-size:15px}.mapnote{font-size:12px;color:#64748b;margin-top:16px}
.drivers{padding:10px;display:grid;gap:9px}.driver{background:#fff;padding:12px;border-radius:10px;box-shadow:0 1px 4px #0001}.driver b{display:block}.driver span{font-size:12px;color:#64748b}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px}
.assignbox{margin-top:18px;border-top:1px solid #e5e7eb;padding-top:14px}.assignbox select,.assignbox button{width:100%;padding:11px;border-radius:8px;margin-top:7px}.assignbox select{border:1px solid #d1d5db;background:#fff}.assignbox button{border:0;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.assignbox button:disabled{opacity:.45}
.empty{padding:22px;text-align:center;color:#64748b}.hidden{display:none}
@media(max-width:900px){body{overflow:auto}.shell{height:auto;grid-template-columns:1fr}.center{min-height:330px}.panel{max-height:none}}
</style></head>
<body>
<header><div class="brand">CARLINE DSM <small>DESKTOP DISPATCH</small></div><span id="live" class="live">CONNECTING…</span></header>
<div class="shell">
<section class="panel">
<div class="tabs"><button id="activeTab" class="tab active">Active Jobs</button><button id="historyTab" class="tab">History</button></div>
<div id="activeJobs" class="jobs"><div class="empty">Loading jobs…</div></div>
<div id="historyJobs" class="jobs hidden"><div class="empty">Loading history…</div></div>
</section>
<section class="center">
<div class="map">
<div id="gpsLayer" class="gps-layer"></div>
<div id="gpsLegend" class="gps-legend">Waiting for driver GPS…</div>
<div class="mapcard">
<h2 id="detailTitle">Select a job</h2>
<div class="pin">📍 <span id="detailPickup">Choose a booking from the left.</span></div>
<div class="pin">🏁 <span id="detailDestination">—</span></div>
<div id="detailStatus" class="meta"></div>
<div class="assignbox" id="assignBox" style="display:none">
<b>Assign driver</b>
<select id="driverSelect"></select>
<button id="assignButton">Assign Driver</button>
<div id="assignMessage" class="meta"></div>
</div>
<div class="mapnote">Live driver GPS panel. Vehicle positions update from CARLINE Supabase in real time.</div>
</div>
</div>
</section>
<section class="panel"><h3>Drivers</h3><div id="drivers" class="drivers"><div class="empty">Loading drivers…</div></div></section>
</div>
<script>
const db=window.supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp');
let active=[],history=[],driverRows=[],selected=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function refresh(){
 const [a,h,d]=await Promise.all([db.rpc('dispatch_get_bookings'),db.rpc('dispatch_get_completed_jobs'),db.rpc('dispatch_get_drivers')]);
 if(a.error||h.error||d.error){$('activeJobs').innerHTML='<div class="empty">Unable to load dispatch data.</div>';return}
 active=a.data||[];history=h.data||[];driverRows=d.data||[];render();
 if(selected){const fresh=[...active,...history].find(x=>x.id===selected.id);if(fresh)selectJob(fresh);else clearDetail();}
}
function card(b,completed=false){
 return `<div class="job ${completed?'completed':''}" onclick="selectById('${b.id}')"><div class="top"><b>${esc(b.pickup_address)}</b><span class="badge">${esc(b.booking_status).replaceAll('_',' ').toUpperCase()}</span></div><div class="route">📍 ${esc(b.pickup_address)}<br>🏁 ${esc(b.destination_address)}</div><div class="meta">${esc(b.id.slice(0,8))}… • ${esc(b.passenger_count)} passenger</div></div>`;
}
function render(){
 $('activeJobs').innerHTML=active.length?active.map(b=>card(b)).join(''):'<div class="empty">No active jobs.</div>';
 $('historyJobs').innerHTML=history.length?history.map(b=>card(b,true)).join(''):'<div class="empty">No completed jobs.</div>';
 $('drivers').innerHTML=driverRows.length?driverRows.map(d=>`<div class="driver"><b><span class="dot"></span>${esc(d.full_name)}</b><span>${esc(d.phone||'')} • ${esc(d.status)}</span></div>`).join(''):'<div class="empty">No drivers.</div>';
 renderDriverGps();
}

function driverLat(d){return Number(d.latitude ?? d.current_latitude)}
function driverLng(d){return Number(d.longitude ?? d.current_longitude)}
function renderDriverGps(){
 const layer=$('gpsLayer'), legend=$('gpsLegend');
 if(!layer||!legend)return;
 const live=driverRows.filter(d=>Number.isFinite(driverLat(d))&&Number.isFinite(driverLng(d)));
 layer.innerHTML='';
 if(!live.length){legend.textContent='Waiting for driver GPS…';return}
 const lats=live.map(driverLat), lngs=live.map(driverLng);
 let minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
 if(maxLat===minLat){maxLat+=0.005;minLat-=0.005}
 if(maxLng===minLng){maxLng+=0.005;minLng-=0.005}
 live.forEach(d=>{
   const x=12+76*((driverLng(d)-minLng)/(maxLng-minLng));
   const y=18+64*(1-((driverLat(d)-minLat)/(maxLat-minLat)));
   const m=document.createElement('div');
   m.className='driver-marker';m.style.left=x+'%';m.style.top=y+'%';
   m.innerHTML='<span class="car">🚕</span>'+esc(d.full_name);
   m.title=driverLat(d).toFixed(6)+', '+driverLng(d).toFixed(6);
   layer.appendChild(m);
 });
 legend.textContent=live.length+' live driver'+(live.length===1?'':'s')+' • GPS connected';
}
function selectById(id){const b=[...active,...history].find(x=>x.id===id);if(b)selectJob(b)}
function selectJob(b){
 selected=b;$('detailTitle').textContent='Booking '+b.id.slice(0,8)+'…';$('detailPickup').textContent=b.pickup_address;$('detailDestination').textContent=b.destination_address;
 $('detailStatus').textContent='Status: '+b.booking_status.replaceAll('_',' ').toUpperCase()+' • '+b.passenger_count+' passenger';
 const assignable=['pending','assigned'].includes(b.booking_status);
 $('assignBox').style.display=assignable?'block':'none';
 if(assignable){
   $('driverSelect').innerHTML='<option value="">Choose driver…</option>'+driverRows.map(d=>`<option value="${d.id}" ${d.id===b.driver_id?'selected':''}>${esc(d.full_name)} — ${esc(d.status)}</option>`).join('');
   $('assignButton').textContent=b.driver_id?'Reassign Driver':'Assign Driver';
 }
}
function clearDetail(){selected=null;$('detailTitle').textContent='Select a job';$('detailPickup').textContent='Choose a booking from the left.';$('detailDestination').textContent='—';$('detailStatus').textContent='';$('assignBox').style.display='none'}
$('assignButton').onclick=async()=>{
 if(!selected||!$('driverSelect').value)return;
 $('assignMessage').textContent='Assigning…';
 const r=await db.rpc('dispatch_assign_driver',{p_booking_id:selected.id,p_driver_id:$('driverSelect').value});
 $('assignMessage').textContent=r.error?'Failed: '+r.error.message:'Driver assigned ✓';
 if(!r.error)await refresh();
};
$('activeTab').onclick=()=>{$('activeTab').classList.add('active');$('historyTab').classList.remove('active');$('activeJobs').classList.remove('hidden');$('historyJobs').classList.add('hidden')};
$('historyTab').onclick=()=>{$('historyTab').classList.add('active');$('activeTab').classList.remove('active');$('historyJobs').classList.remove('hidden');$('activeJobs').classList.add('hidden')};
db.channel('carline-desktop').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'drivers'},refresh).subscribe(s=>{if(s==='SUBSCRIBED'){$('live').textContent='● LIVE';$('live').style.background='#16a34a'}});
refresh();

// Realtime remains the primary update path. This lightweight fallback poll
// keeps job status and driver GPS in sync if a browser misses a Realtime event.
let carlineRefreshBusy = false;
async function carlineFallbackRefresh(){
  if (carlineRefreshBusy) return;
  carlineRefreshBusy = true;
  try { await refresh(); }
  catch (e) { console.warn('CARLINE fallback refresh', e); }
  finally { carlineRefreshBusy = false; }
}
setInterval(carlineFallbackRefresh, 2000);
window.addEventListener('focus', carlineFallbackRefresh);
window.addEventListener('online', carlineFallbackRefresh);
</script></body></html>
