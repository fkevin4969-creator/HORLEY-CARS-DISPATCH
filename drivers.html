<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORLEY CARS — Drivers</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font:13px Arial;background:#2f3337;color:#20252a}.top{height:46px;background:#34383d;color:#fff;display:flex;align-items:center;gap:5px;padding:5px 8px}.logo{font-size:19px;font-weight:900;margin-right:10px}.nav{border:0;background:#555b61;color:#fff;padding:9px 13px;font-weight:800;cursor:pointer}.nav.active{background:#1473e6}.spacer{flex:1}.live{background:#16a34a;border-radius:12px;padding:5px 10px;font-weight:800}.wrap{padding:7px}.panel{background:#eee;border:1px solid #777;min-height:calc(100vh - 60px)}.title{background:#aaa;color:#fff;font-weight:900;padding:9px 12px}.filters{padding:14px;background:#e5e5e5;border-bottom:5px solid #555;display:grid;grid-template-columns:1fr 1fr;gap:9px 32px}.field{display:grid;grid-template-columns:125px 1fr;gap:8px;align-items:center}.field label{text-align:right;font-weight:700}.field input,.field select{height:29px;border:1px solid #aaa;background:#fff;padding:4px 6px}.list{background:#fff;overflow:auto}.list table{width:100%;border-collapse:collapse}.list th{background:#4f5459;color:#fff;padding:8px;text-align:left;position:sticky;top:0;white-space:nowrap}.list td{padding:8px;border-bottom:1px solid #ddd;white-space:nowrap}.no{display:inline-block;min-width:40px;text-align:center;background:#16a34a;color:#fff;font-weight:900;padding:6px;border-radius:3px}.date{font-weight:700}.back{cursor:pointer}@media(max-width:800px){.filters{grid-template-columns:1fr}.field{grid-template-columns:95px 1fr}}</style></head><body><div class="top"><div class="logo">HORLEY CARS</div><button class="nav back" onclick="location.href='./?v=driverscolumns'">DISPATCH</button><button class="nav">BOOKINGS</button><button class="nav active">DRIVERS</button><button class="nav">HISTORY</button><button class="nav">MESSAGES</button><div class="spacer"></div><span class="live" id="live">CONNECTING</span></div><div class="wrap"><div class="panel"><div class="title">DRIVERS</div><div class="filters"><div class="field"><label>DRIVER NUMBER</label><input id="number" placeholder="Driver number"></div><div class="field"><label>NAME</label><input id="name" placeholder="Driver name"></div><div class="field"><label>REGISTRATION</label><input id="reg" placeholder="Registration"></div><div class="field"><label>BADGE</label><input id="badge" placeholder="Badge number"></div><div class="field"><label>PHONE</label><input id="phone" placeholder="Phone"></div></div><div class="list"><table><thead><tr><th>DRIVER NUMBER</th><th>NAME</th><th>PHONE</th><th>REGISTRATION</th><th>PLATE</th><th>BADGE</th><th>LAST LOGIN</th><th>LAST BOOKING</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading drivers…</td></tr></tbody></table></div></div></div><script>const db=supabase.createClient('https://oomcctbdttlyknykqzea.supabase.co','sb_publishable_tGKO1cNzfOecGn0JhdzO-w_2z8omEPp');let D=[],$=x=>document.getElementById(x),e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dt(v,empty){if(!v)return empty||'—';let x=new Date(v);if(isNaN(x))return empty||'—';return x.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function render(){let qn=$('number').value.toLowerCase(),qname=$('name').value.toLowerCase(),qr=$('reg').value.toLowerCase(),qb=$('badge').value.toLowerCase(),qp=$('phone').value.toLowerCase();let a=D.filter((d,i)=>{let n=String(d.driver_number??i+1).padStart(2,'0');return(!qn||n.toLowerCase().includes(qn))&&(!qname||String(d.full_name||'').toLowerCase().includes(qname))&&(!qr||String(d.vehicle_registration||'').toLowerCase().includes(qr))&&(!qb||String(d.licence_number||'').toLowerCase().includes(qb))&&(!qp||String(d.phone||'').toLowerCase().includes(qp))});$('rows').innerHTML=a.length?a.map((d,i)=>{let n=String(d.driver_number??i+1).padStart(2,'0');return `<tr><td><span class="no">${e(n)}</span></td><td>${e(d.full_name||'Driver '+n)}</td><td>${e(d.phone||'—')}</td><td>${e(d.vehicle_registration||'—')}</td><td>${e(d.vehicle_make||'—')}</td><td>${e(d.licence_number||'—')}</td><td class="date">${e(dt(d.last_logged_in,'NOT RECORDED YET'))}</td><td class="date">${e(dt(d.last_booking,'NO BOOKING YET'))}</td></tr>`}).join(''):'<tr><td colspan="8">No matching drivers.</td></tr>'}async function load(){let r=await db.rpc('dispatch_get_drivers');if(r.error){$('rows').innerHTML='<tr><td colspan="8">Could not load drivers.</td></tr>';return}D=r.data||[];render();$('live').textContent='● LIVE'}['number','name','reg','badge','phone'].forEach(x=>$(x).addEventListener('input',render));db.channel('drivers-page').on('postgres_changes',{event:'*',schema:'public',table:'drivers'},load).subscribe();db.channel('bookings-driver-page').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},load).subscribe();load();</script></body></html>
